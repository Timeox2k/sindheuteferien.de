# Deployed by Coolify. Values come from the environment variables set in Coolify;
# the SQLite database lives on the "sqlite" volume and survives every deployment.
services:
  app:
    build: .
    environment:
      AUTORUN_ENABLED: "true"
      PHP_OPCACHE_ENABLE: "1"
      APP_NAME: ${APP_NAME:-sindheuteferien.de}
      APP_ENV: ${APP_ENV:-production}
      APP_KEY: ${APP_KEY}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${APP_URL}
      APP_LOCALE: ${APP_LOCALE:-de}
      APP_FALLBACK_LOCALE: ${APP_FALLBACK_LOCALE:-de}
      APP_FAKER_LOCALE: ${APP_FAKER_LOCALE:-de_DE}
      LOG_CHANNEL: ${LOG_CHANNEL:-stderr}
      LOG_LEVEL: ${LOG_LEVEL:-warning}
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/www/html/database/sqlite/database.sqlite
      SESSION_DRIVER: ${SESSION_DRIVER:-database}
      CACHE_STORE: ${CACHE_STORE:-database}
      QUEUE_CONNECTION: ${QUEUE_CONNECTION:-database}
      MAIL_MAILER: ${MAIL_MAILER:-log}
      ADSENSE_CLIENT_ID: ${ADSENSE_CLIENT_ID:-}
    volumes:
      - sqlite:/var/www/html/database/sqlite

  scheduler:
    build: .
    command: ["php", "/var/www/html/artisan", "schedule:work"]
    stop_signal: SIGTERM
    healthcheck:
      test: ["CMD", "healthcheck-schedule"]
      start_period: 10s
    environment:
      APP_NAME: ${APP_NAME:-sindheuteferien.de}
      APP_ENV: ${APP_ENV:-production}
      APP_KEY: ${APP_KEY}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${APP_URL}
      APP_LOCALE: ${APP_LOCALE:-de}
      LOG_CHANNEL: ${LOG_CHANNEL:-stderr}
      LOG_LEVEL: ${LOG_LEVEL:-warning}
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/www/html/database/sqlite/database.sqlite
      CACHE_STORE: ${CACHE_STORE:-database}
      QUEUE_CONNECTION: ${QUEUE_CONNECTION:-database}
      MAIL_MAILER: ${MAIL_MAILER:-log}
    volumes:
      - sqlite:/var/www/html/database/sqlite
    depends_on:
      - app

volumes:
  sqlite:
